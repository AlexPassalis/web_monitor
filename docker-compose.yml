networks:
  network_project:
    external: true

volumes:
  volume_pjoject_postgres:
    external: true
  volume_project_valkey:
    external: true

services:
  db:
    container_name: db
    build:
      context: ./services/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: project_postgres_password
    restart: always
    volumes:
      - volume_pjoject_postgres:/var/lib/postgresql/data
    networks:
      - network_project
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'",
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  cache:
    container_name: cache
    build:
      context: ./services/cache
      dockerfile: Dockerfile
    restart: always
    volumes:
      - volume_project_valkey:/data
    networks:
      - network_project
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    container_name: backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: project_postgres_password
      CELERY_BROKER_URL: redis://cache:6379/0 # Celery message broker (task queue) - using Valkey database 0
      CELERY_RESULT_BACKEND: redis://cache:6379/1 # Celery result storage (task results) - using Valkey database 1
    tty: true
    restart: always
    volumes:
      - ./services/backend:/app
    networks:
      - network_project
    ports:
      - "8000:8000"

  celery_worker:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    container_name: celery_worker
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    command: celery -A config worker -Q high_priority,medium_priority,low_priority --loglevel=info
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: project_postgres_password
      CELERY_BROKER_URL: redis://cache:6379/0 # Celery message broker (task queue) - using Valkey database 0
      CELERY_RESULT_BACKEND: redis://cache:6379/1 # Celery result storage (task results) - using Valkey database 1
    restart: always
    volumes:
      - ./services/backend:/app
    networks:
      - network_project

  celery_beat:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    container_name: celery_beat
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    command: celery -A config beat --loglevel=info
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: project_postgres_password
      CELERY_BROKER_URL: redis://cache:6379/0 # Celery message broker (task queue) - using Valkey database 0
      CELERY_RESULT_BACKEND: redis://cache:6379/1 # Celery result storage (task results) - using Valkey database 1
    restart: always
    volumes:
      - ./services/backend:/app
    networks:
      - network_project

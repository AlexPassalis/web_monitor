networks:
  network_web_monitor:
    external: true

volumes:
  volume_web_monitor_postgres:
    external: true
  volume_web_monitor_valkey:
    external: true
  volume_web_monitor_minio:
    external: true

services:
  db:
    container_name: db
    build:
      context: ./services/db
      dockerfile: Dockerfile
    env_file:
      - ./services/db/.env
    restart: always
    volumes:
      - volume_web_monitor_postgres:/var/lib/postgresql/data
    networks:
      - network_web_monitor
    ports:
      - "5432:5432"
    healthcheck:
      start_period: 10s
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 2

  cache:
    container_name: cache
    build:
      context: ./services/cache
      dockerfile: Dockerfile
    restart: always
    volumes:
      - volume_web_monitor_valkey:/data
    networks:
      - network_web_monitor
    ports:
      - "6379:6379"
    healthcheck:
      start_period: 10s
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 2

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    restart: always
    volumes:
      - volume_web_monitor_minio:/data
    networks:
      - network_web_monitor
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      start_period: 10s
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 2

  backend:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./services/backend/.env
    tty: true
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_web_monitor
    ports:
      - "8000:8000"
    healthcheck:
      start_period: 10s
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 2

  celery_beat:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: celery_beat
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    command: uv run watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A config beat --loglevel=info
    env_file:
      - ./services/backend/.env
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_web_monitor

  celery_worker:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: celery_worker
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    user: appuser
    command: uv run watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A config worker -Q high_priority,medium_priority,low_priority --loglevel=info -E
    env_file:
      - ./services/backend/.env
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_web_monitor
    healthcheck:
      start_period: 10s
      test:
        [
          "CMD-SHELL",
          "uv run celery -A config inspect ping -d celery@$${HOSTNAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 2

  gateway:
    depends_on:
      backend:
        condition: service_healthy
    container_name: gateway
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: always
    networks:
      - network_web_monitor
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      start_period: 10s
      test:
        ["CMD-SHELL", "curl -kf https://localhost/health | grep ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2

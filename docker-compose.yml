networks:
  network_project:
    external: true

volumes:
  volume_postgres:
    external: true
# volume_redis:
# external: true

services:
  db:
    container_name: db
    build:
      context: ./services/db
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: xI5-9wToNG9sHRNW-3iz
    volumes:
      - volume_postgres:/var/lib/postgresql/data
    networks:
      - network_project
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'",
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  #  cache:

  backend:
    depends_on:
      db:
        condition: service_healthy
    # cache:
    # condition: service_healthy
    container_name: backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: project_postgres_db
      POSTGRES_USER: project_postgres_user
      POSTGRES_PASSWORD: xI5-9wToNG9sHRNW-3iz
    tty: true
    restart: always
    volumes:
      - ./services/backend:/app
    networks:
      - network_project
    ports:
      - "8000:8000"

networks:
  network_project:
    external: true

volumes:
  volume_pjoject_postgres:
    external: true
  volume_project_valkey:
    external: true
  volume_project_minio:
    external: true

services:
  db:
    container_name: db
    build:
      context: ./services/db
      dockerfile: Dockerfile
    env_file:
      - ./services/db/.env
    restart: always
    volumes:
      - volume_pjoject_postgres:/var/lib/postgresql/data
    networks:
      - network_project
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'",
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  cache:
    container_name: cache
    build:
      context: ./services/cache
      dockerfile: Dockerfile
    restart: always
    volumes:
      - volume_project_valkey:/data
    networks:
      - network_project
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    restart: always
    volumes:
      - volume_project_minio:/data
    networks:
      - network_project
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./services/backend/.env
    tty: true
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_project
    ports:
      - "8000:8000"

  celery_beat:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: celery_beat
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    command: uv run watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A config beat --loglevel=info
    env_file:
      - ./services/backend/.env
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_project

  celery_worker:
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    container_name: celery_worker
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      target: dev
    user: appuser
    command: uv run watchmedo auto-restart --directory=/app --pattern='*.py' --recursive -- celery -A config worker -Q high_priority,medium_priority,low_priority --loglevel=info -E
    env_file:
      - ./services/backend/.env
    restart: always
    volumes:
      - ./services/backend:/app
      - /app/.venv
    networks:
      - network_project

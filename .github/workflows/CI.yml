name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

  check:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Install frontend dependencies
        run: make install_frontend
      - name: Run code checks
        run: make check

  test_migrations:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Check for missing migrations
        run: make check_missing_migrations
      - name: Apply migrations
        run: make migrate

  test_backend:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Run backend tests with coverage
        run: make test_coverage
      - name: Copy coverage from container to host
        run: docker cp backend:/tmp/coverage.xml ./services/backend/coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./services/backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  test_frontend:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: make install_frontend
      - name: Install Playwright Browsers
        run: bin/in_frontend bunx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: make test_frontend
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          retention-days: 30
          name: playwright-report
          path: services/gateway/frontend/tests/results/

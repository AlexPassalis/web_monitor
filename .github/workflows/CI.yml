name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

  check:
    name: check
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install frontend dependencies
        run: make install_frontend
      - name: Initialize Docker Swarm
        run: docker swarm init
      - name: Docker stack deploy
        run: make start_backend
      - name: Run code checks
        run: make check

  test_backend:
    name: test_backend
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Initialize Docker Swarm
        run: docker swarm init
      - name: Docker stack deploy
        run: make start_backend
      - name: Run backend tests with coverage
        run: make test_coverage
      - name: Copy coverage from container to host
        run: |
          CONTAINER_ID=$(docker ps -q -f "name=web_monitor_backend" | head -n 1)
          docker cp $CONTAINER_ID:/tmp/coverage.xml ./services/backend/coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./services/backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  test_migrations_and_frontend:
    name: test_migrations_and_frontend
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build
        with:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
      - name: Initialize Docker Swarm
        run: docker swarm init
      - name: Docker stack deploy
        run: make start_backend
      - name: Check for missing migrations
        run: make check_missing_migrations
      - name: Apply migrations
        run: make migrate
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install frontend dependencies
        run: make install_frontend
      - name: Install Playwright Chrome browser
        run: bin/in_frontend bunx playwright install chromium --with-deps
      - name: Run frontend tests
        run: make test_frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          retention-days: 30
          name: playwright-report
          path: services/gateway/frontend/tests/results/

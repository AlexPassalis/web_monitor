name: "Build"
description: "Build all the Docker compose containers"
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Start the containers
      shell: bash
      run: make start

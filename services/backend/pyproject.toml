[tool.ruff]
line-length = 100
target-version = "py313" # Python version 3.13

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["COM812"] # add missing trailing commas

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE="config.settings"
python_files=["test_*.py"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
explicit_package_bases = true
files = ["."]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pyright]
include = ["django-stubs", "django_stubs_ext"]

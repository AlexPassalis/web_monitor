{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <style>
      html {
        font-size: 16px;
      }

      body {
        margin: 0;
        padding: 10px;
        height: 100vh;
        box-sizing: border-box;
        background-color: black;
        color: white;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        font-size: 1rem;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        padding: 10px;
      }

      *,
      *::before,
      *::after {
        font-family: inherit;
        font-size: inherit;
        font-weight: 700;
      }

      .countdown-div {
        text-align: right;
        font-size: small;
        margin: 8px 0;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-rows: repeat(8, 1fr);
        gap: 8px;
      }

      h2 {
        margin: 0;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
      }
      .row-success {
        background-color: green;
      }
      .row-failure {
        background-color: red;
      }
      .row-error-loading {
        position: relative;
        background: #b32a36;
        overflow: hidden;
      }
      .row-error-loading::after {
        position: absolute;
        inset: 0;
        content: '';
        background-image: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.18) 0px,
          rgba(255, 255, 255, 0.18) 14px,
          transparent 14px,
          transparent 28px
        );
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const DURATION = 10_000
        const start = Date.now()
        const el = document.getElementById('countdown')

        function tick() {
          const remaining = Math.max(0, DURATION - (Date.now() - start))
          const secs = Math.ceil(remaining / 1000)
          if (el) {
            el.textContent = secs
          }

          if (remaining <= 0) {
            location.reload()
          } else {
            setTimeout(tick, remaining > 1000 ? 250 : 50)
          }
        }

        tick()
      })
    </script>
  </head>
  <body>
    <div class="countdown-div">
      Update in <span id="countdown">10</span> secs
    </div>
    <ul>
      {% for update in latest_updates %}
      <li
        class="row{% if update.status == 'SUCCESS' %} row-success {% elif update.status == 'FAILURE' %} row-failure {% elif update.status == 'Error loading' %} row-error-loading {% endif %}"
      >
        <h2>{{ update.name }}</h2>
        <div>
          <span>{{ update.status }}</span>
          <time>({{ update.mins_ago }} min ago)</time>
        </div>
      </li>
      {% endfor %}
    </ul>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" id="favicon" />
    <script>
      const hostname =
        window.location.hostname === "localhost"
          ? "localhost"
          : "alexpassalis.com";
      document.getElementById(
        "favicon"
      ).href = `https://${hostname}/static/favicon.svg`;
    </script>
    <title>Web Monitor - Monitor webpage updates</title>
    <meta
      name="description"
      content="Monitor webpages for visual updates. Get notified when websites update with automatic screenshot comparisons and update detection."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" id="favicon" />
    <script>
      const hostname =
        window.location.hostname === "localhost"
          ? "localhost"
          : "alexpassalis.com";
      document.getElementById(
        "favicon"
      ).href = `https://${hostname}/static/favicon.svg`;
    </script>
    <title>Bun + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const file_path = hostname === "localhost" ? "./main.tsx" : "./main.js";
      const script = document.createElement("script");
      script.type = "module";
      script.src = file_path;
      document.body.appendChild(script);
    </script>
  </body>
</html>

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format custom '$status $request_method $request_uri '
                    'total=${request_time}s upstream=${upstream_response_time}s ${body_bytes_sent}bytes '
                    '[$time_local] $realip_remote_addr "$http_user_agent"';

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=image_cache:50m max_size=1g inactive=1d use_temp_path=off;

    server {
        server_name localhost;
        http2 on;
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/alexpassalis.com.pem;
        ssl_certificate_key /etc/nginx/certs/alexpassalis.com.key;

        location /health {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 200 "ok";
        }

        location /static/ {
            limit_except GET {
                deny all;
            }

            proxy_cache static_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8000;
        }

        location /api/image/ {
            limit_except GET {
                deny all;
            }

            proxy_cache image_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8000;
        }

        location ~ ^/(api|admin) {
            limit_except OPTIONS GET POST DELETE {
                deny all;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8000;
        }

        location / {
            limit_except GET {
                deny all;
            }

            proxy_pass http://host.docker.internal:3000;
        }

        error_log /var/log/nginx/error.log notice;
        access_log /var/log/nginx/access.log custom;
    }
}

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format custom '$status $request_method $request_uri '
                    'total=${request_time}s upstream=${upstream_response_time}s ${body_bytes_sent}bytes '
                    '[$time_local] $realip_remote_addr "$http_user_agent"';

    server {
        server_name localhost;
        http2 on;
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/project.pem;
        ssl_certificate_key /etc/nginx/certs/project.key;

        location /nginx {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 200 "ok";
        }

        location ~ ^/(api|admin|static) {
            limit_except OPTIONS GET POST {
                deny all;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://backend:8000;            
        }

        location / {
            limit_except GET {
                deny all;
            }

            proxy_pass http://host.docker.internal:3000;
        }

        error_log /var/log/nginx/error.log notice;
        access_log /var/log/nginx/access.log custom;
    }
}
